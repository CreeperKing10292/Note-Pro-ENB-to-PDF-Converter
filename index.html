<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logic Note Pro ENB Viewer</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:auto;padding:22px;background:#f5f5f7;color:#111}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 12px #0001;margin-bottom:18px}
button,input{font:inherit} button{padding:10px 14px;border:0;border-radius:10px;background:#111;color:white}
canvas{width:100%;height:auto;background:white;border:1px solid #ddd;margin:10px 0}
.small{color:#666;font-size:.9rem}.page{margin:22px 0}
@media print {.no-print{display:none}.card{box-shadow:none;padding:0}.page{break-after:page}body{background:white;max-width:none}}
</style>
</head>
<body>
<div class="card no-print">
<h1>Logic Note Pro ENB Viewer</h1>
<p>Select an <b>.enb</b> file (or the same file renamed to <b>.zip</b>). It stays on your device.</p>
<input id="file" type="file" accept=".enb,.zip,application/zip">
<button id="print" disabled>Print / Save as PDF</button>
<p id="status" class="small">Waiting for a file.</p>
</div>
<div id="pages"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>s?.replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function color(v){
  v=(v||'#FF000000').replace('#','');
  if(v.length===8)v=v.slice(2);
  return '#'+v.padStart(6,'0');
}
function val(node,tag,def=''){
  const e=node.getElementsByTagName(tag)[0];
  return e?.textContent ?? def;
}
function pts(s){return (s||'').split(';').map(x=>x.trim()).filter(Boolean).map(x=>x.split(',').map(Number)).filter(p=>p.length>=2)}
function line(ctx,p,w,col,closed=false){
 if(p.length<2)return; ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
 for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);
 if(closed)ctx.closePath();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
}
async function renderXml(xmlText, index){
 const doc=new DOMParser().parseFromString(xmlText,'application/xml');
 const data=doc.querySelector('Slide > Data')||doc.querySelector('Data');
 const W=+val(data,'Width','3840'), H=+val(data,'Height','2160');
 const cv=document.createElement('canvas'); cv.width=W;cv.height=H;
 const ctx=cv.getContext('2d');ctx.fillStyle=color(val(data,'BackgroundValue','#FFFFFFFF'));ctx.fillRect(0,0,W,H);
 const packages=doc.querySelectorAll('Packages > Package');
 packages.forEach(pkg=>{
   const type=pkg.getAttribute('Type'), d=pkg.querySelector(':scope > Data');
   if(!d)return;
   const col=color(val(d,'ForegroundColor','#FF000000')), w=+val(d,'Thickness','3');
   if(type==='Ink'||type==='StraightLine') line(ctx,pts(val(d,'Points')),w,col);
   else if(type==='Rectangle'||type==='Diamond') line(ctx,pts(val(d,'Points')),w,col,true);
   else if(type==='Ellipse'){
     const a=val(d,'StartPoint','0,0').split(',').map(Number), b=val(d,'EndPoint','0,0').split(',').map(Number);
     ctx.beginPath();ctx.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2,Math.abs(b[1]-a[1])/2,0,0,Math.PI*2);
     ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();
   }
 });
 const wrap=document.createElement('div');wrap.className='card page';
 wrap.innerHTML='<div class="small">Page '+(index+1)+'</div>';wrap.appendChild(cv);$('#pages').appendChild(wrap);
}
$('#file').onchange=async e=>{
 $('#pages').innerHTML=''; $('#print').disabled=true;
 const f=e.target.files[0];if(!f)return;
 try{
   $('#status').textContent='Opening '+f.name+'…';
   const zip=await JSZip.loadAsync(await f.arrayBuffer());
   let names=Object.keys(zip.files).filter(n=>/Slide_\d+\.xml$/i.test(n));
   names.sort((a,b)=>(+a.match(/Slide_(\d+)/i)[1])-(+b.match(/Slide_(\d+)/i)[1]));
   if(!names.length)throw Error('No Slide_*.xml files found. This may be a different ENB format.');
   for(let i=0;i<names.length;i++){ $('#status').textContent=`Rendering page ${i+1} of ${names.length}…`; await renderXml(await zip.file(names[i]).async('text'),i); await new Promise(r=>setTimeout(r,0));}
   $('#status').textContent=`Rendered ${names.length} pages locally. Use Print / Save as PDF.`;
   $('#print').disabled=false;
 }catch(err){$('#status').textContent='Could not open this file: '+err.message}
};
$('#print').onclick=()=>window.print();
</script>
</body></html>
